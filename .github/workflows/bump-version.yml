name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Bump version
        id: bump
        uses: callowayproject/bump-my-version@22dbc5c88dba0ce5552078b48278d96467264b6d # 1.8.1
        env:
          BUMPVERSION_TAG: "true"
        with:
          args: ${{ inputs.bump-type }}
          # Use a Personal Access Token (PAT) to ensure the publish workflow is triggered on tag push
          github-token: ${{ secrets.PAT_TOKEN }}
      - name: Check
        if: steps.bump.outputs.bumped == 'true'
        env:
          PREVIOUS_VERSION: ${{ steps.bump.outputs.previous-version }}
          CURRENT_VERSION: ${{ steps.bump.outputs.current-version }}
        run: |
          printf 'Version was bumped from %s to %s!\n' "$PREVIOUS_VERSION" "$CURRENT_VERSION"
