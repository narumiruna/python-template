# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo  = "https://github.com/pre-commit/pre-commit-hooks"
rev   = "v6.0.0"
hooks = [{ id = "check-yaml" }, { id = "end-of-file-fixer" }, { id = "mixed-line-ending", args = ["--fix=lf"] }, { id = "trailing-whitespace" }]

[[repos]]
repo  = "https://github.com/astral-sh/ruff-pre-commit"
rev   = "v0.17.5"
hooks = [{ id = "ruff", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo  = "https://github.com/astral-sh/uv-pre-commit"
rev   = "0.13.8"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo  = "https://github.com/narumiruna/ty-pre-commit"
rev   = "v0.0.104"
hooks = [{ id = "ty-check" }]

[[repos]]
repo  = "https://github.com/tombi-toml/tombi-pre-commit"
rev   = "v1.11.2"
hooks = [{ id = "tombi-format" }]

[[repos]]
repo  = "https://github.com/zizmorcore/zizmor-pre-commit"
rev   = "v1.30.1"
hooks = [{ id = "zizmor", args = ["--pedantic", "."], pass_filenames = false, always_run = true }]
